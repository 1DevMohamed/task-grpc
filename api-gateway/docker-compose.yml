services:
    order-service:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: gateway-service
        ports:
            - "8001:8001"
        volumes:
            - .:/var/www/html
        environment:
            APP_ENV:              local
            APP_KEY:              base64:CHANGE_ME==
            SQS_REGION:           us-east-1
            SQS_ENDPOINT:         http://elastic:9324
            SQS_KEY:              x
            SQS_SECRET:           x

        networks:
            - microservices

networks:
    microservices:
        external: true